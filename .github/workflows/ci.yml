name: Windows checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test-and-package:
    name: Windows ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            arch: x64
            target: portable
            extension: exe
          - runner: windows-11-arm
            arch: arm64
            target: zip
            extension: zip
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          architecture: ${{ matrix.arch }}
          cache: npm
      - name: Verify native runner architecture
        run: node -e "if (process.platform !== 'win32' || process.arch !== '${{ matrix.arch }}') throw new Error('Expected Windows ${{ matrix.arch }}, received ' + process.platform + ' ' + process.arch)"
      - run: npm ci
      - run: npm test
      - name: Verify Windows helper layout
        shell: pwsh
        run: |
          $result = & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoLogo -NoProfile -NonInteractive -STA -ExecutionPolicy Bypass -File native/windows-helper.ps1 -SelfTest
          if ($LASTEXITCODE -ne 0) { throw 'Windows helper self-test failed' }
          $checks = $result | ConvertFrom-Json
          if (-not $checks.ok -or $checks.inputSize -ne 40 -or $checks.interactiveActions -ne 0) { throw 'Unexpected Windows helper layout or behavior' }
      - run: npm run build
      - name: Package Windows application
        run: npx electron-builder --win ${{ matrix.target }} --${{ matrix.arch }} --publish never
      - name: Verify packaged Electron runtime
        shell: pwsh
        run: |
          $artifact = Get-Item release/LingoLeaf-*-${{ matrix.arch }}.${{ matrix.extension }}
          if ('${{ matrix.target }}' -eq 'zip') {
            Expand-Archive -LiteralPath $artifact.FullName -DestinationPath release/arm64-verification
            node scripts/verify-windows-package.mjs --arch ${{ matrix.arch }} --dir release/arm64-verification
          } else {
            node scripts/verify-windows-package.mjs --arch ${{ matrix.arch }} --portable $artifact.FullName
          }
      - name: Upload Windows application
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: LingoLeaf-windows-${{ matrix.arch }}
          path: release/LingoLeaf-*-${{ matrix.arch }}.${{ matrix.extension }}
          if-no-files-found: error
      - name: Upload package verification diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: LingoLeaf-package-check-${{ matrix.arch }}
          path: test-results/package-check-${{ matrix.arch }}/
          if-no-files-found: ignore
