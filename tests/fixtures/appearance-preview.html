<!doctype html>
<html lang="zh-CN">
  <head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>LingoLeaf · Synthetic UI fixture</title></head>
  <body><div id="root"></div><script type="module">
    // UI-only fixture served by Vite. Not included in the production build and never calls an LLM.
    const cacheKey='lingoleaf.ui-fixture.savedAppearance.v1';
    const appearance=()=>{try{return JSON.parse(localStorage.getItem(cacheKey))||{theme:'forest',fontSize:'large'}}catch{return{theme:'forest',fontSize:'large'}}};
    const params=new URLSearchParams(location.search);
    let uiLanguage=params.get('ui')||localStorage.getItem('lingoleaf.ui-fixture.language.v1')||'zh-CN';
    localStorage.setItem('lingoleaf-ui-language',uiLanguage);
    const original='Hi Maya,\n\nHere is my plans for this week:\n\n1. Read an English article.\n   - Write down useful phrases.\n2. Practice with a friend.\n\nLet me know what you thinks.\n\nBest,\nAlex';
    const result={mode:'grammar',original,corrected:'Hi Maya,\n\nHere are my plans for this week:\n\n1. Read an English article.\n   - Write down useful phrases.\n2. Practice with a friend.\n\nLet me know what you think.\n\nBest,\nAlex',translation:'嗨，Maya：\n\n这是我本周的计划：\n\n1. 读一篇英语文章。\n   - 记下有用的短语。\n2. 和朋友一起练习。\n\n请告诉我你的想法。\n\n祝好，\nAlex',translationLanguage:'简体中文',isCorrect:false,explanation:'这是用于界面检查的示例，保留原文的段落、空行和列表缩进。\n\n- plans 是复数，要搭配 are。\n- you 后的动词使用原形 think。',issues:[{original:'Here is my plans for this week:\n\n1. Read an English article.\n   - Write down useful phrases.',replacement:'Here are my plans for this week:\n\n1. Read an English article.\n   - Write down useful phrases.',rule:'主谓一致',explanation:'主语 plans 是复数。\n将 is 改为 are，保留列表和缩进。',kind:'grammar'},{original:'you thinks',replacement:'you think',rule:'动词原形',explanation:'you 后的动词不加 -s。',kind:'grammar'}],tags:['主谓一致','日常表达'],example:'Here are my plans for tomorrow:\n\n1. Read a short story.\n2. Write a reply.'};
    result.professional={text:'Hi Maya,\n\nPlease find my learning priorities for this week below:\n\n1. Read an English article and note useful expressions.\n2. Practice speaking with a partner.\n\nI would appreciate your feedback.\n\nBest regards,\nAlex',explanation:'这是可选的风格提升，适合较正式的邮件。原文修正语法后也可以自然使用；是否采用更正式的措辞取决于双方关系。',improvements:['learning priorities 明确这些计划是本周的学习重点。','I would appreciate your feedback 比 Let me know what you think 更正式、礼貌。','Best regards 是较正式的邮件结尾。']};
    if(params.has('showcase'))Object.assign(result,await fetch('/tests/fixtures/showcase.json').then(response=>response.json()));
    if(params.has('stress-text')){const extra='\n\nLiteral text: <strong>not rendered as HTML</strong>\n\tIndented with a tab\nReference: https://example.invalid/'+ 'longword'.repeat(30);result.corrected+=extra;result.translation+='\n\n保留空行与制表符：\n\t这是缩进的一行。\n未解析的标记：<strong>纯文本</strong>';result.professional.text+=extra}
    const legacyResult={...result};delete legacyResult.translation;delete legacyResult.translationLanguage;delete legacyResult.professional;
    const reading={mode:'read',original:'Had I known about the delay, I would have taken an earlier train.\n\nWhat matters most is how we respond to change.',corrected:'如果我早知道会延误，我就会乘坐更早的一班火车。\n\n最重要的是我们如何应对变化。',isCorrect:true,explanation:'先表达对过去的假设，再强调面对变化时的态度。',issues:[],tags:['虚拟语气','主语从句'],example:'Had I left earlier, I would have arrived on time.',grammarPoints:[{text:'Had I known about the delay',explanation:'省略 if 后将 had 提到主语前，等于 If I had known。描述与过去事实相反的假设。'},{text:'What matters most is how we respond to change.',explanation:'What matters most 是主语从句；how we respond to change 是表语从句。'}],keyPoints:['作者当时不知道会延误，因此没有乘更早的火车。','面对变化，如何回应比变化本身更重要。']};
    const expression={mode:'express',original:'有点忙，想把同事的请求推到下周，但不想太冷淡。',corrected:'I’m a little tied up this week, but I’d be happy to take a look next week.',isCorrect:true,explanation:'先简短说明当前情况，再明确表达愿意帮忙并给出时间。',issues:[],tags:['委婉表达','工作沟通'],example:'I’d be happy to help once I wrap this up.',alternatives:[{text:'Could we revisit this next week? I’d love to give it the attention it deserves.',tone:'礼貌、重视对方',explanation:'强调希望认真处理请求，适合需要委婉延期的场景。'},{text:'This week is a bit hectic. Would next week work for you?',tone:'轻松、简短',explanation:'先说明忙碌，再询问对方是否方便，适合熟悉的同事。'}],clarificationQuestions:['这件事是否有明确的截止时间？'],expressionContext:'给同事发消息',expressionTone:'友好、委婉'};
    const review={dueAt:new Date(Date.now()-86400000).toISOString(),interval:0,ease:2.5,repetitions:0,lastReviewedAt:null};
    let entries=[{...result,id:'11111111-1111-4111-8111-111111111111',createdAt:new Date().toISOString(),updatedAt:new Date().toISOString(),review,sourceLanguage:'English',targetLanguage:'English'},{...result,id:'22222222-2222-4222-8222-222222222222',mode:'translate',original:'谢谢你的耐心，我会尽快回复。',corrected:'Thank you for your patience. I will get back to you as soon as possible.',isCorrect:true,issues:[],explanation:'这是界面测试示例。get back to you 表示再次回复对方；as soon as possible 表示尽快。这样的说法礼貌、自然，也适合工作交流。',example:'I will get back to you tomorrow.',tags:['日常表达','礼貌回复'],createdAt:new Date().toISOString(),updatedAt:new Date().toISOString(),review,sourceLanguage:'Auto',targetLanguage:'English'}];
    let settings={provider:'compatible',endpoint:'http://127.0.0.1:1234/v1',requestProtocol:'auto',model:'ui-fixture-only',apiKey:'',hasApiKey:false,azureApiVersion:'2024-10-21',targetLanguage:'English',explanationLanguage:'简体中文',grammarShortcut:'Control+Shift+G',translateShortcut:'Control+Shift+T',libraryPath:'C:\\Learning notes',autoReplace:true,launchAtLogin:false,saveCorrectSentences:false,...appearance()};
    entries.push(...[reading,expression].map((item,index)=>({...item,id:`${index+3}${index+3}${index+3}${index+3}${index+3}${index+3}${index+3}${index+3}-${index+3}${index+3}${index+3}${index+3}-4${index+3}${index+3}${index+3}-8${index+3}${index+3}${index+3}-${String(index+3).repeat(12)}`,createdAt:new Date().toISOString(),updatedAt:new Date().toISOString(),review,sourceLanguage:item.mode==='read'?'English':'Auto',targetLanguage:item.mode==='read'?'简体中文':'English',conversation:[]})));
    let askCalls=0;
    const listeners=new Set();const changed=()=>listeners.forEach(f=>f());
    let appearanceReads=0;
    window.lingo={
      getUiLanguage:async()=>uiLanguage,
      saveUiLanguage:async value=>{await new Promise(resolve=>setTimeout(resolve,100));if(params.has('language-save-error'))throw Error('Synthetic language-save failure');uiLanguage=value;localStorage.setItem('lingoleaf.ui-fixture.language.v1',value);changed();return uiLanguage},
      getAppearance:async()=>{if(new URLSearchParams(location.search).has('read-error-once') && ++appearanceReads===1)throw Error('模拟一次读取失败');return appearance()},
      saveAppearance:async value=>{await new Promise(resolve=>setTimeout(resolve,100));if(new URLSearchParams(location.search).has('save-error'))throw Error('模拟外观保存失败');localStorage.setItem(cacheKey,JSON.stringify(value));changed();return value},
      getState:async()=>({settings:{...settings,uiLanguage,...appearance()},entries:structuredClone(entries),shortcuts:{grammar:true,translate:true},version:'0.4.0'}),
      analyze:async(text,mode,options)=>{await new Promise(resolve=>setTimeout(resolve,300));const chosen={grammar:result,translate:entries[1],read:reading,express:expression}[mode];const entry={...chosen,original:text,id:crypto.randomUUID(),createdAt:new Date().toISOString(),updatedAt:new Date().toISOString(),review,sourceLanguage:mode==='read'?'English':'Auto',targetLanguage:mode==='read'?'简体中文':'English',conversation:[],...(mode==='express'?{expressionContext:options?.context,expressionTone:options?.tone}:{})};entries.unshift(entry);changed();return {...entry,entryId:entry.id}},
      ask:async request=>{await new Promise(resolve=>setTimeout(resolve,params.has('ask-delay')?3000:300));if(params.has('ask-error-once')&&++askCalls===1)throw Error('模拟连接失败，问题已保留，请重试。');const answer='这里可以从两个角度理解：\n\n1. 先看句子的时间背景，再确定时态。\n2. 根据你补充的场景，选择更自然的语气。\n\n例如：Had I left earlier, I would have arrived on time.\n\n这是界面测试回答，不会调用模型。';const entry=entries.find(item=>item.id===request.entryId);if(entry){entry.conversation=[...(entry.conversation||[]),{id:crypto.randomUUID(),question:request.question,answer,createdAt:new Date().toISOString()}];changed()}return {answer,entry:entry?structuredClone(entry):undefined}},
      saveSettings:async value=>{settings={...value,uiLanguage,...appearance()};changed();return settings},
      testProvider:async()=>{throw Error('仅用于界面测试的连接错误：请检查接口地址与请求协议。')},
      chooseLibrary:async()=>null,openLibrary:async()=>{},
      review:async(id,rating)=>{entries=entries.map(e=>e.id===id?{...e,review:{...e.review,dueAt:new Date(Date.now()+86400000).toISOString(),lastReviewedAt:new Date().toISOString()}}:e);changed();return entries.find(e=>e.id===id)},
      deleteEntry:async id=>{entries=entries.filter(e=>e.id!==id);changed()},copy:async()=>{},replace:async()=>({ok:true,message:'仅测试替换状态'}),
      mobileStart:async()=>({running:true,urls:['http://127.0.0.1:41700/#ui-fixture-only'],qrDataUrl:'data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240"><rect width="240" height="240" fill="white"/><path fill="#234b40" d="M20 20h70v70H20zm130 0h70v70h-70zM20 150h70v70H20zm95-35h30v30h-30zm45 15h20v20h-20zm20 40h40v50h-40zm-65 25h25v25h-25z"/></svg>')}),
      mobileStop:async()=>({running:false,urls:[]}),mobileStatus:async()=>({running:false,urls:[]}),exportLibrary:async()=>null,minimize:()=>{},close:()=>{},openMain:()=>{},
      onResult:callback=>{const kind=params.get('result');const selected={translate:entries[1],read:entries[2],express:entries[3],legacy:legacyResult}[kind]||entries[0];const event=kind==='error'?{status:'error',mode:'grammar',message:'无法连接配置的模型接口。请检查网络、接口地址与协议设置，然后重新尝试。这是用于检查深色模式和长文本换行的示例。'}:kind==='loading'?{status:'loading',mode:'grammar',original}:{status:'done',mode:selected.mode,result:selected,entryId:selected.id||entries[0].id,canReplace:true};queueMicrotask(()=>callback(event));return()=>{}},
      onChanged:callback=>{listeners.add(callback);return()=>listeners.delete(callback)},
    };
    await import('/src/renderer/main.tsx');
  </script></body>
</html>
